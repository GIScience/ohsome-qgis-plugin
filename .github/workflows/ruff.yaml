name: Lint

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v4
        with:
          python-version: "3.12"
      
      - run: pip install ruff
      
      - name: Lint with ruff
        run: ruff check minimal/ tests/
      
      - name: Format check
        run: ruff format --check minimal/ tests/