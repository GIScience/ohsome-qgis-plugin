name: Run PyQt6 Test
on:
  workflow_dispatch:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

env:
  QGIS_TEST_VERSION: latest

jobs:
  pyqt6-check:
    uses: qgis/qgis-plugin-ci/.github/workflows/pyqt6_test.yml@master
    with:
      plugin_path: ohsome_osm_downloader